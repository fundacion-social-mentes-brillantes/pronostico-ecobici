name: Página

# Publica la web del proyecto (carpeta web/) en GitHub Pages, junto con la memoria en PDF y en Word.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "memoria/memoria.pdf"
      - "memoria/memoria.docx"
      - ".github/workflows/pagina.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Armar el sitio
        run: |
          mkdir -p _sitio
          cp -r web/. _sitio/
          cp memoria/memoria.pdf memoria/memoria.docx _sitio/
          touch _sitio/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _sitio
      - id: despliegue
        uses: actions/deploy-pages@v5
